name: Feature request
description: Suggest an improvement to Mojo language support
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the Mojo workflow or code that needs IDE support.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Mojo code
      render: mojo
